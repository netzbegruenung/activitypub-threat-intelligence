# Builds release binaries when a tag vYYYY.MM.N or vYYYY.MM.NN is pushed and
# attaches them to a Forgejo release. Each binary is uploaded as an individual
# artifact; example configs and fail2ban files are bundled in a separate
# tarball. The tagged commit must be part of the main branch.
#
# Required repository secret: forgejo_token (API token with write access to
# releases). Adjust base_url below to your Forgejo instance.
when:
  - event: tag
    ref: refs/tags/v[0-9][0-9][0-9][0-9].[0-9][0-9].{[0-9],[0-9][0-9]}

steps:
  - name: verify-tag
    image: alpine/git
    commands:
      - echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]{1,2}$'
      - git fetch --unshallow origin main:refs/remotes/origin/main || git fetch origin main:refs/remotes/origin/main
      - git merge-base --is-ancestor "$CI_COMMIT_SHA" refs/remotes/origin/main

  - name: test
    image: rust:1.85-bookworm
    depends_on: [verify-tag]
    commands:
      - cd reference-daemon
      - cargo test --workspace --locked

  - name: build
    image: rust:1.85-bookworm
    depends_on: [test]
    commands:
      - cd reference-daemon
      - cargo build --workspace --release --locked
      - mkdir -p ../dist ../config-pkg
      - for bin in aptid apti-tui apti-fail2ban apti-allowlist apti-rspamd apti-dashboard; do cp "target/release/$$bin" "../dist/$$bin-$CI_COMMIT_TAG-linux-x86_64"; done
      - cp config.example.toml crates/apti-fail2ban/apti-fail2ban.example.toml crates/apti-allowlist/apti-allowlist.example.toml crates/apti-rspamd/apti-rspamd.example.toml crates/apti-dashboard/apti-dashboard.example.toml ../config-pkg/
      - cp -r crates/apti-fail2ban/fail2ban ../config-pkg/
      - cp -r crates/apti-rspamd/rspamd ../config-pkg/
      - tar -czf "../dist/aptid-config-$CI_COMMIT_TAG.tar.gz" -C ../config-pkg .
      - cd ../dist && sha256sum * > SHA256SUMS

  - name: release
    image: woodpeckerci/plugin-release
    depends_on: [build]
    settings:
      base_url: https://git.verdigado.com
      api_key:
        from_secret: forgejo_token
      files:
        - dist/*
      title: ${CI_COMMIT_TAG}
