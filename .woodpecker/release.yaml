# Builds release binaries when a tag vYYYY.MM.N or vYYYY.MM.NN is pushed and
# attaches them to a Forgejo release. Each binary is uploaded as an individual
# artifact; example configs and fail2ban files are bundled in a separate
# tarball and the amd64 Debian packages are attached as well. The tagged commit must be part of the main branch.
#
# Required repository secret: forgejo_token (API token with write access to
# releases). Adjust base_url below to your Forgejo instance.
when:
  - event: tag
    ref: refs/tags/v[0-9][0-9][0-9][0-9].[0-9][0-9].{[0-9],[0-9][0-9]}

steps:
  - name: verify-tag
    image: alpine/git
    commands:
      - echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]{1,2}$'
      - git fetch --unshallow origin main:refs/remotes/origin/main || git fetch origin main:refs/remotes/origin/main
      - git merge-base --is-ancestor "$CI_COMMIT_SHA" refs/remotes/origin/main
      # The binaries report their version from CARGO_PKG_VERSION while the
      # Debian packages are named after the tag, so a forgotten bump would
      # ship a package that misreports its own version.
      - |
        workspace_version=$$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' reference-daemon/Cargo.toml)
        if [ "v$$workspace_version" != "$CI_COMMIT_TAG" ]; then
          echo "tag $CI_COMMIT_TAG does not match workspace version $$workspace_version" >&2
          exit 1
        fi

  - name: test
    image: rust:1.85-bookworm
    depends_on: [verify-tag]
    commands:
      - cd reference-daemon
      - cargo test --workspace --locked

  - name: build
    image: rust:1.85-bookworm
    depends_on: [test]
    commands:
      - cd reference-daemon
      - cargo build --workspace --release --locked
      - mkdir -p ../dist ../config-pkg
      - for bin in pubsecd pubsec-tui pubsec-fail2ban pubsec-allowlist pubsec-rspamd pubsec-dashboard pubsec-statsd; do cp "target/release/$$bin" "../dist/$$bin-$CI_COMMIT_TAG-linux-x86_64"; done
      - cp config.example.toml crates/pubsec-fail2ban/pubsec-fail2ban.example.toml crates/pubsec-allowlist/pubsec-allowlist.example.toml crates/pubsec-rspamd/pubsec-rspamd.example.toml crates/pubsec-dashboard/pubsec-dashboard.example.toml crates/pubsec-statsd/pubsec-statsd.example.toml ../config-pkg/
      - cp -r crates/pubsec-fail2ban/fail2ban ../config-pkg/
      - cp -r crates/pubsec-rspamd/rspamd ../config-pkg/
      - tar -czf "../dist/pubsecd-config-$CI_COMMIT_TAG.tar.gz" -C ../config-pkg .
      - packaging/build-deb.sh "$CI_COMMIT_TAG" target/release ../dist
      - cd ../dist && sha256sum * > SHA256SUMS

  - name: release
    image: woodpeckerci/plugin-release
    depends_on: [build]
    settings:
      base_url: https://git.verdigado.com
      api_key:
        from_secret: forgejo_token
      files:
        - dist/*
      title: ${CI_COMMIT_TAG}

  # Tells repo.pubsec.net to mirror the new release into its Debian pool.
  # The receiver authenticates the request by the HMAC over the body alone.
  - name: publish-apt-repo
    image: alpine:3.21
    depends_on: [release]
    environment:
      WEBHOOK_URL:
        from_secret: apt_repo_webhook_url
      WEBHOOK_SECRET:
        from_secret: apt_repo_webhook_secret
    commands:
      - apk add --no-cache curl openssl
      - |
        if [ -z "$$WEBHOOK_URL" ] || [ -z "$$WEBHOOK_SECRET" ]; then
          echo "APT repository webhook not configured, skipping."
          exit 0
        fi
        body=$$(printf '{"tag":"%s"}' "$CI_COMMIT_TAG")
        sig=$$(printf '%s' "$$body" | openssl dgst -sha256 -hmac "$$WEBHOOK_SECRET" -r | cut -d' ' -f1)
        curl -fsS --retry 3 --retry-delay 10 -X POST "$$WEBHOOK_URL" \
          -H 'Content-Type: application/json' \
          -H "X-Hub-Signature-256: sha256=$$sig" \
          --data "$$body"
