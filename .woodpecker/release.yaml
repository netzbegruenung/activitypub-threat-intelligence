# Builds release binaries when a tag vYYYY.MM.N or vYYYY.MM.NN is pushed and
# attaches them to a Forgejo release. The tagged commit must be part of the
# main branch.
#
# Required repository secret: forgejo_token (API token with write access to
# releases). Adjust base_url below to your Forgejo instance.
when:
  - event: tag
    ref: refs/tags/v[0-9][0-9][0-9][0-9].[0-9][0-9].{[0-9],[0-9][0-9]}

steps:
  - name: verify-tag
    image: alpine/git
    commands:
      - echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]{1,2}$'
      - git fetch --unshallow origin main:refs/remotes/origin/main || git fetch origin main:refs/remotes/origin/main
      - git merge-base --is-ancestor "$CI_COMMIT_SHA" refs/remotes/origin/main

  - name: test
    image: rust:1.85-bookworm
    depends_on: [verify-tag]
    commands:
      - cd reference-daemon
      - cargo test --workspace --locked

  - name: build
    image: rust:1.85-bookworm
    depends_on: [test]
    commands:
      - cd reference-daemon
      - cargo build --workspace --release --locked
      - mkdir -p ../dist/pkg
      - cp target/release/aptid target/release/apti-tui target/release/apti-fail2ban ../dist/pkg/
      - cp config.example.toml crates/apti-fail2ban/apti-fail2ban.example.toml ../dist/pkg/
      - cp -r crates/apti-fail2ban/fail2ban ../dist/pkg/
      - tar -czf "../dist/aptid-$CI_COMMIT_TAG-linux-x86_64.tar.gz" -C ../dist/pkg .
      - cd ../dist && sha256sum "aptid-$CI_COMMIT_TAG-linux-x86_64.tar.gz" > SHA256SUMS

  - name: release
    image: woodpeckerci/plugin-release
    depends_on: [build]
    settings:
      base_url: https://git.verdigado.com
      api_key:
        from_secret: forgejo_token
      files:
        - dist/aptid-*.tar.gz
        - dist/SHA256SUMS
      title: ${CI_COMMIT_TAG}
