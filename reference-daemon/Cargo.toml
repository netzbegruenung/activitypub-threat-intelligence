[workspace]
resolver = "3"
members = ["crates/pubsec-core", "crates/pubsecd", "crates/pubsec-tui", "crates/pubsec-fail2ban", "crates/pubsec-allowlist", "crates/pubsec-rspamd", "crates/pubsec-dashboard", "crates/pubsec-statsd"]

[workspace.package]
version = "2026.11.2"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

# RSA key generation and SQLite are very slow unoptimised; optimise
# dependencies in dev/test builds.
[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
pubsec-core = { path = "crates/pubsec-core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
