# fail2ban filter for ban files written by `apti-fail2ban pull`.
#
# Line format:
#   2026-10-03 12:00:00 apti-ban 45.13.7.9 behavior=ssh-bruteforce expires=2026-10-04T12:00:00Z
#
# <SUBNET> matches an address with an optional CIDR prefix (fail2ban >= 0.10).

[Definition]

failregex = ^\s*apti-ban <SUBNET> behavior=\S+ expires=\S+\s*$

ignoreregex =

datepattern = {^LN-BEG}%%Y-%%m-%%d %%H:%%M:%%S
