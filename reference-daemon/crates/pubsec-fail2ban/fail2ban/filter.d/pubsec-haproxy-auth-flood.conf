# Many 401s in a short time against sites with HTTP authentication.
#
# Expects HAProxy's httplog format. _skip holds paths whose clients produce 401s
# during normal operation; override it in a .local file to fit your sites.

[INCLUDES]
before = common.conf

[Definition]
_daemon = haproxy
_pre = ^%(__prefix_line)s<ADDR>:\d+ \[[^\]]+\] \S+ \S+ \S+

# Nextcloud: sync clients with an expired app password produce 401s continuously,
# previews and avatars dozens per folder once the session has expired.
# WordPress REST API: editor with an expired nonce.
_skip = (?:https?://[^/\s]+)?/(?:remote\.php|public\.php|status\.php|index\.php|ocs|apps|core|avatar|login|wp-json|wp-admin)

failregex = %(_pre)s 401 .*"[A-Z]+ (?!%(_skip)s)\S+ HTTP

ignoreregex =

journalmatch = SYSLOG_IDENTIFIER=haproxy
datepattern = {^LN-BEG}
