# 404 flood: many non-existent pages in a short time (scanner path lists).
# Static files do not count, otherwise a site with broken images would lock out its visitors.
#
# Expects HAProxy's httplog format. _skip holds application paths that answer 404
# during normal operation; override it in a .local file to fit your sites.

[INCLUDES]
before = common.conf

[Definition]
_daemon = haproxy
_pre = ^%(__prefix_line)s<ADDR>:\d+ \[[^\]]+\] \S+ \S+ \S+

# Nextcloud: missing previews (/core/preview) return 404, dozens per minute in photo folders.
_skip = (?:https?://[^/\s]+)?/(?:index\.php|remote\.php|public\.php|status\.php|ocs|ocs-provider|ocm-provider|apps|custom_apps|core|avatar|dist|login|settings|s)[/?\s]
_static = [^\s?]*(?i:\.(?:css|js|mjs|map|json|xml|txt|png|jpe?g|gif|svg|webp|avif|heic|ico|bmp|woff2?|ttf|eot|otf|mp[34]|mov|webm|ogg|pdf)|/favicon[^/\s?]*|/apple-touch-icon[^/\s?]*|/\.well-known/[^\s?]*)[\s?]

failregex = %(_pre)s 404 .*"(?:GET|POST|HEAD) (?!%(_skip)s)(?!%(_static)s)\S+ HTTP

ignoreregex =

journalmatch = SYSLOG_IDENTIFIER=haproxy
datepattern = {^LN-BEG}
