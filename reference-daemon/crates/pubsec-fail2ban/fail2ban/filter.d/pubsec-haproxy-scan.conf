# Files that must never be publicly reachable on any site (.env, VCS metadata, credentials,
# debug endpoints, phpinfo). Applies to all sites behind HAProxy, not just WordPress.
# Only requests that did not return 200 count: a request that succeeded hit a real
# resource on this host, so the client was not scanning for it.
#
# Expects HAProxy's httplog format. Override _skip in a .local file to exclude
# paths that legitimately serve such names on your sites.

[INCLUDES]
before = common.conf

[Definition]
_daemon = haproxy

# httplog: client:port [date] frontend backend/server timers status ... "METHOD URI HTTP/x"
_pre = ^%(__prefix_line)s<ADDR>:\d+ \[[^\]]+\] \S+ \S+ \S+ (?!200\b)\d{3} .*"(?:GET|POST|HEAD)

# HTTP/2 requests are logged with https://host. Nextcloud WebDAV is excluded, it serves
# synced .git and .env files. Only the path is checked, not the query string.
_skip = (?:https?://[^/\s]+)?/(?:remote|public)\.php/
_path = (?!%(_skip)s)[^\s?]*

failregex = %(_pre)s %(_path)s/(?:\.env|\.git/|\.svn/|\.hg/|\.aws/|\.ssh/|\.vscode/|\.DS_Store|\.htpasswd|wp-config\.php|vendor/phpunit/|_ignition/|_profiler/|phpinfo\.php|info\.php)

ignoreregex =

journalmatch = SYSLOG_IDENTIFIER=haproxy
datepattern = {^LN-BEG}
