# Many 401s in a short time against sites with HTTP authentication.
#
# For Apache and nginx access logs in "combined" format. _skip holds paths whose
# clients produce 401s during normal operation; override it in a .local file.

[INCLUDES]
before = pubsec-httpd-common.conf

[Definition]

# Nextcloud: sync clients with an expired app password produce 401s continuously,
# previews and avatars dozens per folder once the session has expired.
# WordPress REST API: editor with an expired nonce.
_skip = /(?:remote\.php|public\.php|status\.php|index\.php|ocs|apps|core|avatar|login|wp-json|wp-admin)

failregex = %(_pre)s[A-Z]+ (?!%(_skip)s)\S+%(_post)s 401\b

ignoreregex =
