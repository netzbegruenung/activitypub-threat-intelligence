# Shared definitions for the pubsec-httpd-* filters.
#
# These filters read the *access* log of Apache or nginx and match attack
# signatures and status-code floods. They complement the apache-*/nginx-*
# filters shipped with fail2ban, which read the *error* log.
#
# IMPORTANT: the regexes assume the "combined" log format, i.e.
#   1.2.3.4 - - [10/Nov/2026:12:00:00 +0100] "GET /x HTTP/1.1" 404 153 "-" "curl/8"
# which is the Debian default for both servers. With a custom LogFormat the
# filters silently match nothing. Verify with:
#   fail2ban-regex /var/log/apache2/access.log /etc/fail2ban/filter.d/pubsec-httpd-scan.conf

[Definition]

_method = (?:GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)

# Up to and including the opening quote of the request line. The brackets are
# empty because fail2ban removes the matched date from the line before the
# failregex is applied.
_pre = ^<ADDR> \S+ \S+ \[[^\]]*\] "

# From the end of the URI up to the closing quote of the request line.
_post = (?: HTTP/[\d.]+)?"

# Same, followed by a status code other than 200. A request that succeeded hit
# a real resource on this host, so the client was not scanning for it.
_post_nonok = \S*%(_post)s (?!200\b)\d{3}\b

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
