# 404 flood: many non-existent pages in a short time (scanner path lists).
# Static files do not count, otherwise a site with broken images would lock out its visitors.
#
# For Apache and nginx access logs in "combined" format. _skip holds application
# paths that answer 404 during normal operation; override it in a .local file.

[INCLUDES]
before = pubsec-httpd-common.conf

[Definition]

# Nextcloud: missing previews (/core/preview) return 404, dozens per minute in photo folders.
_skip = /(?:index\.php|remote\.php|public\.php|status\.php|ocs|ocs-provider|ocm-provider|apps|custom_apps|core|avatar|dist|login|settings|s)[/?\s]
_static = [^\s?]*(?i:\.(?:css|js|mjs|map|json|xml|txt|png|jpe?g|gif|svg|webp|avif|heic|ico|bmp|woff2?|ttf|eot|otf|mp[34]|mov|webm|ogg|pdf)|/favicon[^/\s?]*|/apple-touch-icon[^/\s?]*|/\.well-known/[^\s?]*)[\s?]

failregex = %(_pre)s%(_method)s (?!%(_skip)s)(?!%(_static)s)\S+%(_post)s 404\b

ignoreregex =
