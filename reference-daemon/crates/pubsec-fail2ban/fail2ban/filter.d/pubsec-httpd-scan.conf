# Files that must never be publicly reachable on any site (.env, VCS metadata, credentials,
# debug endpoints, phpinfo). Only requests that did not return 200 count.
#
# For Apache and nginx access logs in "combined" format. Override _skip in a
# .local file to exclude paths that legitimately serve such names on your sites.

[INCLUDES]
before = pubsec-httpd-common.conf

[Definition]

# Nextcloud WebDAV serves synced .git and .env files.
_skip = /(?:remote|public)\.php/
_path = (?!%(_skip)s)[^\s?]*

failregex = %(_pre)s%(_method)s %(_path)s/(?:\.env|\.git/|\.svn/|\.hg/|\.aws/|\.ssh/|\.vscode/|\.DS_Store|\.htpasswd|wp-config\.php|vendor/phpunit/|_ignition/|_profiler/|phpinfo\.php|info\.php)%(_post_nonok)s

ignoreregex =
