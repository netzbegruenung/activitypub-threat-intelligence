# Settings of the AP-TI reporter (lua.local.d/pubsec.lua).
# Install as ${CONFDIR}/modules.local.d/pubsec.conf (/etc/rspamd on Debian).
pubsec {
  # Report endpoint of pubsec-rspamd ([server].bind).
  url = "http://127.0.0.1:11380/v1/report";
  # Must match ingest.report_secret in the pubsec-rspamd config.
  secret = "change-me-to-a-long-random-string";
  timeout = 2s;
  # Messages below this score are not sent; keep it <= ingest.min_score.
  min_score = 5.0;

  .include(try=true,priority=1,duplicate=merge) "$LOCAL_CONFDIR/local.d/pubsec.conf"
  .include(try=true,priority=10) "$LOCAL_CONFDIR/override.d/pubsec.conf"
}
