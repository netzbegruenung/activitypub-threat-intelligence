# pubsec-statsd: public statistics page for an AP-TI hub.
#
# It polls the hub's internal REST API and publishes aggregates over its
# dataset: a self-contained statistics page (no individual IPs, prefixes or
# domains, per Section 11) and a JSON directory of the hub's connected nodes.
# Individual observables are never served.
#
# Create the [pubsecd] token in the hub's pubsecd with scope `read`. Its
# `max_tlp` caps every figure on the page: active observables, findings and
# the per-node evidence counts. `green` covers the whole community-shareable
# dataset and is the recommended cap for a public page:
#
#   pubsecd token add --name stats --scope read --max-tlp green
#
# Use `--max-tlp clear` to publish counts over TLP:CLEAR entries only. On a
# hub it makes no difference, since a hub ingests TLP:CLEAR evidence only.
# Capping above `green` means publishing figures derived from data that was
# shared under a limited-disclosure marking; prefer not to.

[pubsecd]
# Base URL of the hub's internal REST API.
url = "http://127.0.0.1:8081"
read_token = "pubsec_REPLACE_ME"
timeout_secs = 30

[poll]
# How often the hub is polled.
interval_secs = 60
# Length of the findings window shown on the page.
window_days = 30

[server]
title = "AP-TI public statistics"

# By default pubsec-statsd listens on nothing: after every poll it renders
# index.html and nodes.json into this directory, which nginx, Apache or Caddy
# serves. Files are replaced atomically, so a request never reads a partial
# page. This is the recommended setup: no socket of pubsec-statsd is exposed.
output_dir = "/var/lib/pubsec-statsd/public"

# Alternatively pubsec-statsd can serve the page itself. Uncomment `bind` to
# use that instead of output_dir, and put it behind a TLS-terminating reverse
# proxy. The settings below then apply.
#
# bind = "0.0.0.0:8082"
#
# Per-client request rate limit (requests per minute).
# rate_limit_per_min = 120
#
# Rate-limit by the last X-Forwarded-For entry instead of the peer address.
# Enable only if every request comes through a reverse proxy that sets or
# appends that header; otherwise clients can choose their own address.
# trust_forwarded_for = false
