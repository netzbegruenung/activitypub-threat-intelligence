# A public AP-TI hub: pubsecd in hub mode + pubsec-statsd (public statistics page
# and connected-node directory) behind Caddy for TLS.
#
#   cp .env.example .env
#   cp config/pubsecd-hub.example.toml config/pubsecd-hub.toml       # set [instance]
#   cp config/pubsec-statsd.example.toml config/pubsec-statsd.toml
#   cp Caddyfile.hub.example Caddyfile.hub                       # set hosts
#   docker compose -f compose.hub.example.yaml build
#   docker compose -f compose.hub.example.yaml up -d
#   # create a read token (scope read, max_tlp "green") for pubsec-statsd and
#   # put its secret in config/pubsec-statsd.toml:
#   docker compose -f compose.hub.example.yaml exec pubsecd pubsec-tui --socket /run/pubsecd/control.sock
name: pubsec-hub

services:
  pubsecd:
    build:
      context: .
      dockerfile: Dockerfile.pubsecd
      args:
        PUBSEC_VERSION: ${PUBSEC_VERSION:?set PUBSEC_VERSION in .env}
    image: pubsec/pubsecd:${PUBSEC_VERSION}
    restart: unless-stopped
    volumes:
      - ./config/pubsecd-hub.toml:/etc/pubsecd/config.toml:ro
      - pubsecd-data:/var/lib/pubsecd
      - pubsecd-run:/run/pubsecd
    ports:
      # ActivityPub listener: Caddy passes the Host header through.
      - "127.0.0.1:8080:8080"
      # Internal REST API: reached by pubsec-statsd over the compose network.
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"ok\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pubsec-statsd:
    build:
      context: .
      dockerfile: Dockerfile.pubsec-statsd
      args:
        PUBSEC_VERSION: ${PUBSEC_VERSION:?set PUBSEC_VERSION in .env}
    image: pubsec/pubsec-statsd:${PUBSEC_VERSION}
    restart: unless-stopped
    depends_on:
      pubsecd:
        condition: service_healthy
    volumes:
      - ./config/pubsec-statsd.toml:/etc/pubsec-statsd/config.toml:ro
      # The rendered page and node directory, served by Caddy. pubsec-statsd
      # publishes no port of its own.
      - statsd-public:/var/lib/pubsec-statsd/public

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [pubsecd, pubsec-statsd]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.hub:/etc/caddy/Caddyfile:ro
      - statsd-public:/srv/stats:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pubsecd-data:
  statsd-public:
  pubsecd-run:
  caddy-data:
  caddy-config:
