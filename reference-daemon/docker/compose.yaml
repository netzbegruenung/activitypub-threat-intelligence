# pubsecd + pubsec-fail2ban + fail2ban. Images are built locally, nothing is
# pulled from or pushed to a registry:
#
#   cp .env.example .env            # pick the release tag
#   cp config/pubsecd.example.toml config/pubsecd.toml            # edit
#   cp config/pubsec-fail2ban.example.toml config/pubsec-fail2ban.toml
#   docker compose build
#   docker compose up -d pubsecd
#   docker compose exec pubsecd pubsec-tui --socket /run/pubsecd/control.sock   # create tokens
#   # put the tokens into config/pubsec-fail2ban.toml, then:
#   docker compose up -d fail2ban pubsec-fail2ban
name: pubsec

services:
  pubsecd:
    build:
      context: .
      dockerfile: Dockerfile.pubsecd
      args:
        PUBSEC_VERSION: ${PUBSEC_VERSION:?set PUBSEC_VERSION in .env}
    image: pubsec/pubsecd:${PUBSEC_VERSION}
    restart: unless-stopped
    volumes:
      - ./config/pubsecd.toml:/etc/pubsecd/config.toml:ro
      - pubsecd-data:/var/lib/pubsecd
      - pubsecd-run:/run/pubsecd
    ports:
      # ActivityPub listener: put a TLS reverse proxy in front (keep Host).
      - "127.0.0.1:8080:8080"
      # Internal REST API. Never expose it to the Internet.
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"ok\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # fail2ban only. Bans are applied to the host's netfilter, so the container
  # shares the host network and needs these capabilities. This is the only
  # privileged part of the setup.
  fail2ban:
    build:
      context: ..    # reference-daemon/, for the fail2ban filter
      dockerfile: docker/Dockerfile.fail2ban
    image: pubsec/fail2ban:${PUBSEC_VERSION}
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./fail2ban/fail2ban.local:/etc/fail2ban/fail2ban.local:ro
      - ./fail2ban/jail.d:/etc/fail2ban/jail.d:ro
      - f2b-log:/var/log/fail2ban
      # Ban files written by `pubsec-fail2ban pull`, followed by the pubsec jails.
      - f2b-pull:/var/log/pubsec-fail2ban:ro
      # Logs of other containers: see compose.landscape.example.yaml.

  # The connector: reports fail2ban's bans to pubsecd and writes the active
  # list back out for fail2ban. Unprivileged, no host network.
  pubsec-fail2ban:
    build:
      context: ..    # reference-daemon/
      dockerfile: docker/Dockerfile.pubsec-fail2ban
      args:
        PUBSEC_VERSION: ${PUBSEC_VERSION:?set PUBSEC_VERSION in .env}
    image: pubsec/pubsec-fail2ban:${PUBSEC_VERSION}
    restart: unless-stopped
    depends_on:
      pubsecd:
        condition: service_healthy
    volumes:
      - ./config/pubsec-fail2ban.toml:/etc/pubsec-fail2ban/config.toml:ro
      - f2b-state:/var/lib/pubsec-fail2ban
      - f2b-pull:/var/log/pubsec-fail2ban
      # fail2ban's log, read by `push`.
      - f2b-log:/var/log/fail2ban:ro

volumes:
  pubsecd-data:
  pubsecd-run:
  f2b-state:
  f2b-pull:
  f2b-log:
