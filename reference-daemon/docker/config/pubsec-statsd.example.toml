# pubsec-statsd configuration for the docker hub setup.
#
# Points at the pubsecd service in the same compose file. Use a `read` token
# whose max_tlp is "green": that cap decides which entries the published
# counts cover (a hub ingests TLP:CLEAR only, so there it changes nothing).
# Only aggregates and the node directory are served, never individual
# observables.
# Create it with: docker compose exec pubsecd pubsec-tui --socket /run/pubsecd/control.sock

[pubsecd]
url = "http://pubsecd:8081"
read_token = "pubsec_REPLACE_ME"
timeout_secs = 30

[poll]
interval_secs = 60
window_days = 30

[server]
# The page and the node directory are rendered into this directory after
# every poll; Caddy serves it from the same volume. pubsec-statsd itself
# listens on nothing, so it has no public attack surface.
output_dir = "/var/lib/pubsec-statsd/public"
title = "AP-TI public statistics"
